name: Promote

trigger: none

parameters:
  - name: package_type
    displayName: 'Change type prefix'
    type: string
    values: [SOL, MAP, LIB, DB, HF]
  - name: module_name
    displayName: 'Short module name (e.g. PaymentIngestion)'
    type: string
  - name: package_version
    displayName: 'Semantic version (e.g. v1.2.0)'
    type: string
  - name: export_environment
    displayName: 'Export source (DEV = draft | QA = golden)'
    type: string
    values: [DEV, QA]
  - name: export_package_id
    displayName: 'Export package ID from Adeptia Migration Manager'
    type: string
  - name: import_to_qa
    displayName: 'Import to QA'
    type: boolean
    default: true
  - name: import_to_stage
    displayName: 'Import to Stage'
    type: boolean
    default: false
  - name: import_to_production
    displayName: 'Import to Production'
    type: boolean
    default: false

variables:
  - group: adeptia-credentials  # needs: ADEPTIA_EXPORT_USERNAME, ADEPTIA_EXPORT_PASSWORD, AZURE_DEVOPS_TOKEN
  - group: adeptia-config       # needs: EXPORT_APP_URL

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Promote
    timeoutInMinutes: 60
    steps:
      - checkout: self
        persistCredentials: true

      - bash: |
          VERSION="${{ parameters.package_version }}"
          [[ "$VERSION" != v* ]] && VERSION="v$VERSION"
          BUILD_DATE=$(date +%Y%m%d)
          PACKAGE_BASE="${{ parameters.package_type }}-${{ parameters.module_name }}-${VERSION}-B$(Build.BuildId)-${BUILD_DATE}"
          ENV_LOWER=$(echo '${{ parameters.export_environment }}' | tr '[:upper:]' '[:lower:]')
          ZIP_NAME="${PACKAGE_BASE}-${{ parameters.export_environment }}.zip"
          ZIP_FOLDER="artifacts/${ENV_LOWER}"
          ZIP_PATH="${ZIP_FOLDER}/${ZIP_NAME}"
          PR_BRANCH="migration/${PACKAGE_BASE}"

          ENVS=""
          [ "${{ parameters.import_to_qa }}"         = "True" ] && ENVS="${ENVS}QA,"
          [ "${{ parameters.import_to_stage }}"       = "True" ] && ENVS="${ENVS}Stage,"
          [ "${{ parameters.import_to_production }}"  = "True" ] && ENVS="${ENVS}Production,"
          ENVS="${ENVS%,}"

          if [ -z "$ENVS" ]; then echo "Select at least one target environment"; exit 1; fi

          echo "##vso[task.setvariable variable=PACKAGE_BASE]$PACKAGE_BASE"
          echo "##vso[task.setvariable variable=ZIP_NAME]$ZIP_NAME"
          echo "##vso[task.setvariable variable=ZIP_FOLDER]$ZIP_FOLDER"
          echo "##vso[task.setvariable variable=ZIP_PATH]$ZIP_PATH"
          echo "##vso[task.setvariable variable=PR_BRANCH]$PR_BRANCH"
          echo "##vso[task.setvariable variable=TARGET_ENVS]$ENVS"
          echo "Package    : $PACKAGE_BASE"
          echo "Artifact   : $ZIP_PATH"
          echo "PR Branch  : $PR_BRANCH"
          echo "Target Envs: $ENVS"
        displayName: Resolve parameters

      - bash: |
          RESPONSE=$(curl --insecure --silent -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$(ADEPTIA_EXPORT_USERNAME)\",\"password\":\"$(ADEPTIA_EXPORT_PASSWORD)\",\"requestFrom\":\"web\"}" \
            "$(EXPORT_APP_URL)/rest/login/user")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ACCESS_TOKEN',''))")
          if [ -z "$TOKEN" ]; then echo "Login failed: $RESPONSE"; exit 1; fi
          echo "##vso[task.setvariable variable=ADEPTIA_TOKEN;isSecret=true]$TOKEN"
          echo "Login successful"
        displayName: Login to Adeptia

      - bash: |
          RESPONSE=$(curl --insecure --silent -X POST \
            -H "Content-Type: application/json" \
            -H "ACCESS_TOKEN: $(ADEPTIA_TOKEN)" \
            "$(EXPORT_APP_URL)/rest/migration/export/execute/${{ parameters.export_package_id }}")
          REF_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('referenceId',''))")
          if [ -z "$REF_ID" ]; then echo "Export trigger failed: $RESPONSE"; exit 1; fi
          echo "##vso[task.setvariable variable=REF_ID]$REF_ID"
          echo "Export triggered. Reference ID: $REF_ID"
        displayName: Trigger export

      - bash: |
          STATUS=""
          for i in $(seq 1 15); do
            RESPONSE=$(curl --insecure --silent \
              -H "ACCESS_TOKEN: $(ADEPTIA_TOKEN)" \
              "$(EXPORT_APP_URL)/rest/migration/status?id=$(REF_ID)")
            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','').upper())")
            echo "Attempt $i/15: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then sleep 10; break; fi
            [ $i -lt 15 ] && sleep 30
          done
          if [ "$STATUS" != "FINISHED" ]; then echo "Export timed out"; exit 1; fi
        displayName: Poll export status

      - bash: |
          mkdir -p "$(ZIP_FOLDER)"
          curl --insecure --silent \
            -H "ACCESS_TOKEN: $(ADEPTIA_TOKEN)" \
            "$(EXPORT_APP_URL)/rest/migration/downloadzip?id=$(REF_ID)&type=exportzip" \
            --output "$(ZIP_PATH)"
          echo "Downloaded: $(ZIP_NAME)"
        displayName: Download export ZIP

      - bash: |
          git config user.name "azure-pipelines"
          git config user.email "ci-service@adeptia.com"
          git checkout -b "$(PR_BRANCH)"

          echo "ZIP_PATH=$(ZIP_PATH)"       > promote-config.txt
          echo "TARGET_ENVS=$(TARGET_ENVS)" >> promote-config.txt

          git add "$(ZIP_PATH)" promote-config.txt
          git commit -m "promote: $(ZIP_NAME) -> $(TARGET_ENVS) [run $(Build.BuildId)]"
          git push origin HEAD:"$(PR_BRANCH)"

          EXPORT_ENV="${{ parameters.export_environment }}"
          PR_TITLE="Promote: $(PACKAGE_BASE) -> $(TARGET_ENVS)"
          PR_DESC="## Promote Package\n\n| Field | Value |\n|---|---|\n| **Package** | $(PACKAGE_BASE) |\n| **Export Env** | ${EXPORT_ENV} |\n| **Target Envs** | $(TARGET_ENVS) |\n| **Run** | $(Build.BuildId) |\n\nMerge this PR to trigger automatic import to: $(TARGET_ENVS)"
          PAYLOAD=$(PR_TITLE="$PR_TITLE" PR_DESC="$PR_DESC" PR_BRANCH="$(PR_BRANCH)" python3 -c "import json,os; print(json.dumps({'title':os.environ['PR_TITLE'],'head':os.environ['PR_BRANCH'],'base':'main','body':os.environ['PR_DESC']}))")

          RESPONSE=$(curl --silent -X POST \
            -H "Authorization: token $(GH_TOKEN)" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/shivopamtiwari-adeptia/adeptia-azure-migration/pulls" \
            -d "$PAYLOAD")

          PR_NUMBER=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number',''))")
          if [ -z "$PR_NUMBER" ]; then echo "PR creation failed. Response: $RESPONSE"; exit 1; fi
          echo "Pull Request created: https://github.com/shivopamtiwari-adeptia/adeptia-azure-migration/pull/${PR_NUMBER}"
          echo "Merge the PR to trigger automatic import to: $(TARGET_ENVS)"
        displayName: Commit to branch and create PR
