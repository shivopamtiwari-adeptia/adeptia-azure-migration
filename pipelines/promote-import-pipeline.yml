                      echo "Rollback download attempt $r: HTTP $HTTP"
                      [ "$HTTP" = "200" ] && break
                      [ $r -lt 5 ] && sleep 30
                    done
                    git config user.name "azure-pipelines"
                    git config user.email "ci-service@adeptia.com"
                    git add "$ROLLBACK_PATH"
                    git diff --cached --quiet || (
                      git commit -m "rollback: ${ROLLBACK_NAME} [promoted to Stage]"
                      git pull --rebase origin main
                      git push origin HEAD:main
                    )
                  displayName: Download and commit rollback ZIP

  - stage: ImportProduction
    displayName: Import to Production
    dependsOn:
      - Setup
      - ImportQA
      - ImportStage
    condition: |
      and(
        succeeded('Setup'),
        contains(stageDependencies.Setup.ReadConfig.outputs['config.target_envs'], 'Production'),
        in(dependencies.ImportQA.result, 'Succeeded', 'Skipped'),
        in(dependencies.ImportStage.result, 'Succeeded', 'Skipped')
      )
    variables:
      zip_path: $[ stageDependencies.Setup.ReadConfig.outputs['config.zip_path'] ]
      package_base: $[ stageDependencies.Setup.ReadConfig.outputs['config.package_base'] ]
    jobs:
      - deployment: Import
        environment: Production
        timeoutInMinutes: 60
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: true

                - bash: |
                    RESPONSE=$(curl --insecure --silent -X POST \
                      -H "Content-Type: application/json" \
                      -d "{\"username\":\"$(ADEPTIA_IMPORT_USERNAME)\",\"password\":\"$(ADEPTIA_IMPORT_PASSWORD)\"}" \
                      "$(IMPORT_APP_URL)/rest/login/user")
