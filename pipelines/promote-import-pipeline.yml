                      git commit -m "rollback: ${ROLLBACK_NAME} [promoted to Production]"
                      git pull --rebase origin main
                      git push origin HEAD:main
                    )
                  displayName: Download and commit rollback ZIP

  - stage: CreateTag
    displayName: Create release tag
    dependsOn:
      - Setup
      - ImportQA
      - ImportStage
      - ImportProduction
    condition: |
      and(
        succeeded('Setup'),
        in(dependencies.ImportQA.result, 'Succeeded', 'Skipped'),
        in(dependencies.ImportStage.result, 'Succeeded', 'Skipped'),
        in(dependencies.ImportProduction.result, 'Succeeded', 'Skipped'),
        or(
          eq(dependencies.ImportQA.result, 'Succeeded'),
          eq(dependencies.ImportStage.result, 'Succeeded'),
          eq(dependencies.ImportProduction.result, 'Succeeded')
        )
      )
    variables:
      zip_name: $[ stageDependencies.Setup.ReadConfig.outputs['config.zip_name'] ]
      package_base: $[ stageDependencies.Setup.ReadConfig.outputs['config.package_base'] ]
      qa_result: $[ dependencies.ImportQA.result ]
      stage_result: $[ dependencies.ImportStage.result ]
      prod_result: $[ dependencies.ImportProduction.result ]
    jobs:
      - job: TagRelease
        steps:
          - checkout: self
            persistCredentials: true

          - bash: |
              RELEASE_DATE=$(date +%Y-%m-%d)
              IMPORTED_ENVS=""
              [ "$(qa_result)"    = "Succeeded" ] && IMPORTED_ENVS="${IMPORTED_ENVS}QA, "          || true
              [ "$(stage_result)" = "Succeeded" ] && IMPORTED_ENVS="${IMPORTED_ENVS}Stage, "       || true
              [ "$(prod_result)"  = "Succeeded" ] && IMPORTED_ENVS="${IMPORTED_ENVS}Production, "  || true
              IMPORTED_ENVS="${IMPORTED_ENVS%, }"

              TAG="$(package_base)-release-${RELEASE_DATE}"
              git tag -a "$TAG" -m "Imported $(package_base) to ${IMPORTED_ENVS} on ${RELEASE_DATE}" || echo "Tag already exists, skipping"
              git push origin "$TAG" || echo "Tag push skipped"

              echo ""
              echo "=== Promote Summary ==="
              echo "Package     : $(package_base)"
              echo "Imported to : ${IMPORTED_ENVS}"
              echo "Date        : ${RELEASE_DATE}"
              echo "ZIP         : $(zip_name)"
              echo "Run ID      : $(Build.BuildId)"
            displayName: Tag release and print summary
